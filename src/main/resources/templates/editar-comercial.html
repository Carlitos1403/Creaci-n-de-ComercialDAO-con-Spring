<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Editar comercial | Ventas</title>
</head>
<body>
	<main>
		<h1>Editar comercial</h1>
		<form th:action="@{/comercial/editar/{id}(id=${comercial.id})}" th:object="${comercial}" method="post">
			<p>
				<label for="nombre">Nombre</label>
				<input id="nombre" type="text" th:field="*{nombre}" required maxlength="100">
			</p>
			<p>
				<label for="apellido1">Primer apellido</label>
				<input id="apellido1" type="text" th:field="*{apellido1}" required maxlength="100">
			</p>
			<p>
				<label for="apellido2">Segundo apellido</label>
				<input id="apellido2" type="text" th:field="*{apellido2}" maxlength="100">
			</p>
			<p>
				<label for="comision">Comision</label>
				<input id="comision" type="number" th:field="*{comision}" min="0" max="1" step="0.01">
			</p>
			<button type="submit">Guardar cambios</button>
		</form>
		<p><a th:href="@{/comercial}">Volver al listado</a></p>
	</main>
</body>
</html>
